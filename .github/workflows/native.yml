name: native-android

on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build native shell
        run: gradle -p native :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Upload native debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PF2e-Builder-RU-native-debug
          path: native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
